services:

  db:
    image: postgres:17-alpine
    container_name: ecommerce-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ${DB_USERNAME:-ecommerce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ecommerce}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ecommerce} -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ecommerce-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/ecommerce
      DB_USERNAME: ${DB_USERNAME:-ecommerce}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce}
      JWT_SECRET: ${JWT_SECRET:-clave-super-secreta-para-docker-de-al-menos-32-caracteres-ok}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-}
      MP_BACK_URL: ${MP_BACK_URL:-http://localhost:8080}
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@ecommerce-blandi-arruti.com}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-OAUTH_DISABLED}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-OAUTH_DISABLED}
      CORREO_ARGENTINO_USER_TOKEN: ${CORREO_ARGENTINO_USER_TOKEN:-}
      CORREO_ARGENTINO_PASSWORD_TOKEN: ${CORREO_ARGENTINO_PASSWORD_TOKEN:-}
      CORREO_ARGENTINO_CUSTOMER_ID: ${CORREO_ARGENTINO_CUSTOMER_ID:-}

volumes:
  pgdata:
