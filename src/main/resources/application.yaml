spring:
  application:
    name: E-commerce

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: postgres
    password: ***ROTADO***
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Argentina/Buenos_Aires
    open-in-view: false

server:
  port: 8080

jwt:
  # Clave secreta — mínimo 32 caracteres para HMAC-SHA256. Cambiar en producción.
  secret: ***ROTADO***
  # Expiración del token en milisegundos (86400000 = 24 horas)
  expiration: 86400000